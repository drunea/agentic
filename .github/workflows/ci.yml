name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # agentic.config builds `Settings()` at import time and every field
      # without a default is required — .env.example carries a placeholder
      # for each one. No test touches the network or a real key.
      - run: cp .env.example .env

      - run: ruff check .

      - run: pytest
