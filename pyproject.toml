[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
# Correctness only (syntax errors + pyflakes: undefined names, unused
# imports/variables) — pinned explicitly so CI doesn't change behavior when
# ruff's own default rule set changes between versions. Style/modernization
# rules (import sorting, datetime.UTC, etc.) are deliberately not enabled.
select = ["E9", "F"]
